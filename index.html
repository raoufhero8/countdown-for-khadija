<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Khadija 🫶🎂</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  color: white;
}

/* UI */
#ui {
  position: fixed;
  width: 100%;
  top: 20%;
  text-align: center;
  z-index: 10;
}

#typing {
  font-size: 2.2em;
  border-right: 2px solid white;
  display: inline-block;
  padding-right: 5px;
}

.name {
  font-size: 3.5em;
  margin-top: 15px;
  background: linear-gradient(45deg,#ff9a9e,#fad0c4,#ffd1ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* countdown */
#countdown {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 25px;
}

.box {
  background: rgba(255,255,255,0.1);
  padding: 15px;
  border-radius: 10px;
}

.num { font-size: 1.5em; }
.label { font-size: 0.7em; }

#end {
  display: none;
  margin-top: 20px;
  font-size: 1.5em;
  animation: fade 1.5s;
}

@keyframes fade {
  from {opacity:0;}
  to {opacity:1;}
}
</style>
</head>

<body>

<div id="ui">
  <div id="typing"></div>
  <div class="name">Khadija ✨</div>

  <div id="countdown">
    <div class="box"><div id="d" class="num"></div><div class="label">Days</div></div>
    <div class="box"><div id="h" class="num"></div><div class="label">Hours</div></div>
    <div class="box"><div id="m" class="num"></div><div class="label">Minutes</div></div>
    <div class="box"><div id="s" class="num"></div><div class="label">Seconds</div></div>
  </div>

  <div id="end">Your surprise is ready... 🎉</div>
</div>

<audio id="music" src="music.mp3" loop></audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
// 🌌 3D background
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const starsGeometry = new THREE.BufferGeometry();
const starsCount = 5000;
const positions = new Float32Array(starsCount * 3);

for(let i=0;i<starsCount*3;i++){
  positions[i] = (Math.random() - 0.5) * 2000;
}

starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions,3));

const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1 });
const stars = new THREE.Points(starsGeometry, starsMaterial);
scene.add(stars);

camera.position.z = 5;

function animate(){
  requestAnimationFrame(animate);
  stars.rotation.y += 0.0005;
  renderer.render(scene, camera);
}
animate();

// 📱 حركة بالجوال
if (window.DeviceOrientationEvent) {
  window.addEventListener("deviceorientation", (e)=>{
    camera.rotation.y = e.gamma * 0.002;
    camera.rotation.x = e.beta * 0.002;
  });
}

// ✍️ typing effect
const messages = [
  "Something special is coming...",
  "A moment you will never forget...",
  "Get ready Khadija...",
  "Your surprise is almost here 🎁"
];

let msgIndex = 0;
let charIndex = 0;
const typingEl = document.getElementById("typing");

function type(){
  if(charIndex < messages[msgIndex].length){
    typingEl.innerHTML += messages[msgIndex][charIndex];
    charIndex++;
    setTimeout(type, 50);
  } else {
    setTimeout(()=>{
      typingEl.innerHTML="";
      charIndex=0;
      msgIndex = (msgIndex+1)%messages.length;
      type();
    },2000);
  }
}
type();

// 🎶 تشغيل الموسيقى
document.addEventListener("click", ()=>{
  document.getElementById("music").play().catch(()=>{});
},{once:true});

// ⏳ countdown
const target = new Date("2026-05-30T00:00:00").getTime();

const x = setInterval(()=>{
  const now = new Date().getTime();
  const diff = target - now;

  const d = Math.floor(diff/(1000*60*60*24));
  const h = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
  const m = Math.floor((diff%(1000*60*60))/(1000*60));
  const s = Math.floor((diff%(1000*60))/1000);

  document.getElementById("d").innerHTML=d;
  document.getElementById("h").innerHTML=h;
  document.getElementById("m").innerHTML=m;
  document.getElementById("s").innerHTML=s;

  if(diff<0){
    clearInterval(x);

    document.getElementById("countdown").style.display="none";
    document.getElementById("end").style.display="block";

    setTimeout(()=>{
      window.location.href="https://happy-birthday-khadija-yfw9.arcada.app";
    },2000);
  }
},1000);

// resize
window.addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
